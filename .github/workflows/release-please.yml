# Runs release-please on every push to main, which keeps a release pull request
# up to date from the conventional commits. Merging that pull request bumps the
# version, writes CHANGELOG.md and tags the release; no APK is built here.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
