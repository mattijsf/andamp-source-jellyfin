[versions]
agp = "9.3.1"
kotlin = "2.4.10"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
junit = "4.13.2"
spotless = "8.9.0"
ktlint = "1.8.0"
robolectric = "4.16"
roborazzi = "1.71.0"
detekt = "1.23.8"
composeRules = "0.6.4"
coroutines = "1.11.0"
okhttp = "5.3.0"
# Andamp's source SDK: source-api and source-common
andampSdk = "0.1.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# pinned: the Compose BOM does not manage the icons artifacts
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended", version = "1.7.8" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
androidx-test-core = { group = "androidx.test", name = "core", version = "1.7.0" }
andamp-source-api = { group = "nl.mattix.andamp", name = "source-api", version.ref = "andampSdk" }
andamp-source-common = { group = "nl.mattix.andamp", name = "source-common", version.ref = "andampSdk" }
detekt-compose-rules = { group = "io.nlopez.compose.rules", name = "detekt", version.ref = "composeRules" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
